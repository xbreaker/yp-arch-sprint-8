version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - keycloak-network
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - keycloak-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - keycloak
    environment:
      REACT_APP_API_URL: http://localhost:8081
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    networks:
      - keycloak-network
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - keycloak
    environment:
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_AUTH_SERVER_URL: http://localhost:8080
      KEYCLOAK_AUTH_SERVER_ABSOLUT_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_RESOURCE: reports-frontend
      KEYCLOAK_CREDENTIALS_SECRET: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
    volumes:
      - ./api:/app
      - ~/.m2:/root/.m2
    command: >
      sh -c "mvn clean package -DskipTests &&
      java -jar target/reports-app-*.jar"
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge
